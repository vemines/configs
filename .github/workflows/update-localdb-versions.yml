name: Update LocalDB Versions Feed

on:
  schedule:
    - cron: '0 0 * * *' # Chạy tự động lúc 00:00 UTC mỗi ngày
  workflow_dispatch:      # Nút bấm trigger thủ công trên GitHub Actions UI

# Đảm bảo các workflow không ghi đè lẫn nhau cùng một thời điểm
concurrency:
  group: configs-repo-sync
  cancel-in-progress: false

jobs:
  update-localdb-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Generate localDB/versions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-localdb-versions.mjs

      - name: Commit and Push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add localDB/versions.json
          
          # Nếu không có thay đổi gì thì bỏ qua
          if git diff --staged --quiet; then
            echo "No version changes detected."
            exit 0
          fi
          
          git commit -m "chore(localdb): auto-update database versions feed [skip ci]"
          
          # Pull rebase trước khi push để chống conflict tuyệt đối khi repo phình to
          git pull --rebase origin main
          git push origin main

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "Purging jsDelivr CDN cache for localDB/versions.json..."
          curl -s "https://purge.jsdelivr.net/gh/vemines/configs@main/localDB/versions.json"
          echo "CDN cache successfully purged!"
