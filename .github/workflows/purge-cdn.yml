name: Purge jsDelivr CDN Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      purge_all:
        description: 'Purge all files in repository (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write

concurrency:
  group: purge-cdn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    name: Purge jsDelivr Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full commit history for accurate Git diffs across multi-commit pushes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore last purged commit state
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/last_purged_sha
          key: cdn-purge-state-${{ github.sha }}
          restore-keys: |
            cdn-purge-state-

      - name: Run CDN Purge
        env:
          BASE_SHA: ${{ github.event.before }}
          CACHE_FILE: .cache/last_purged_sha
        run: |
          if [ "${{ github.event.inputs.purge_all }}" = "true" ]; then
            echo "🚀 Purging ALL repository files..."
            node scripts/purge-cdn.mjs --all
          else
            echo "⚡ Purging changed files..."
            node scripts/purge-cdn.mjs
          fi

      - name: Save last purged commit state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache/last_purged_sha
          key: cdn-purge-state-${{ github.sha }}
